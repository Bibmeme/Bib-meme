<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>bibmeme</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        *, body, h1, h2, p, button {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif !important;
        }

        h1, h2 { font-weight: 800 !important; }
        p { font-weight: 500 !important; }
        button { font-weight: 700 !important; }

        @keyframes fadeUp {
            0% {
                opacity: 0;
                transform: translateY(16px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .smooth-title {
            opacity: 0;
            animation: fadeUp 0.9s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        .smooth-desc {
            opacity: 0;
            animation: fadeUp 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.25s forwards;
        }

        .smooth-btn {
            opacity: 0;
            animation: fadeUp 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.5s forwards;
        }
    </style>
</head>
<body class="bg-gray-950 text-white min-h-screen flex items-center justify-center p-6 m-0 text-center">

    <!-- Экран входа -->
    <div id="auth-screen" class="max-w-sm w-full">
        <p class="text-xs text-gray-500 uppercase tracking-widest mb-4 smooth-title">bibmeme</p>
        <h1 class="smooth-title text-2xl text-white mb-3 tracking-tight">Здравствуйте!</h1>
        <p class="smooth-desc text-sm text-gray-400 leading-relaxed mb-8">
            Здесь вы начнете встречать мемы, тренды, общаться, делиться, лайкать и комментировать
        </p>

        <button id="login-btn" class="smooth-btn w-full bg-white text-black p-3.5 rounded-xl text-sm hover:bg-gray-200 transition flex items-center justify-center gap-2.5 cursor-pointer shadow-lg">
            <svg class="w-5 h-5" viewBox="0 0 24 24">
                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
            </svg>
            Войти через Google
        </button>
    </div>

    <!-- Экран после успешного входа -->
    <div id="profile-screen" class="hidden max-w-sm w-full bg-gray-900 border border-gray-800 p-6 rounded-2xl">
        <img id="user-avatar" src="" alt="Avatar" class="w-16 h-16 rounded-full mx-auto mb-3 border border-gray-700">
        <h2 id="user-name" class="text-lg text-white mb-1"></h2>
        <p id="user-email" class="text-xs text-gray-400 mb-6"></p>
        <button id="logout-btn" class="w-full bg-gray-800 text-gray-300 p-3 rounded-xl text-xs hover:bg-gray-700 transition cursor-pointer">
            Выйти из аккаунта
        </button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCOQW4pCX_LWkhHi_QrDUAZ-XYPyHRmI6I",
            authDomain: "bibmeme-def4d.firebaseapp.com",
            projectId: "bibmeme-def4d",
            storageBucket: "bibmeme-def4d.firebasestorage.app",
            messagingSenderId: "640073948297",
            appId: "1:640073948297:web:2289493c6e9ec30c817a58"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        const authScreen = document.getElementById('auth-screen');
        const profileScreen = document.getElementById('profile-screen');
        const loginBtn = document.getElementById('login-btn');
        const logoutBtn = document.getElementById('logout-btn');

        loginBtn.addEventListener('click', async () => {
            try {
                await signInWithPopup(auth, provider);
            } catch (error) {
                console.error("Ошибка входа:", error);
                alert("Не удалось войти: " + error.message);
            }
        });

        logoutBtn.addEventListener('click', () => {
            signOut(auth);
        });

        onAuthStateChanged(auth, (user) => {
            if (user) {
                authScreen.classList.add('hidden');
                profileScreen.classList.remove('hidden');
                document.getElementById('user-avatar').src = user.photoURL || 'https://via.placeholder.com/64';
                document.getElementById('user-name').textContent = user.displayName || 'Пользователь';
                document.getElementById('user-email').textContent = user.email;
            } else {
                profileScreen.classList.add('hidden');
                authScreen.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
